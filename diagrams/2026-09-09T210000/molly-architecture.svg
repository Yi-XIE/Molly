  <!-- 底部用户可见闭环 -->
  <rect x="50" y="920" width="1700" height="112" rx="18" fill="#172033"/>
  <text x="82" y="954" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Yi 只感知一个简单闭环</text>
  <text x="82" y="989" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#DDEBFF">输入想法</text>
  <text x="210" y="989" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" fill="#93B7FF">→</text>
