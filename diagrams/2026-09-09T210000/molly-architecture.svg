  <text x="680" y="989" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" fill="#93B7FF">→</text>
  <text x="720" y="989" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#DDEBFF">产物回流</text>
  <text x="865" y="989" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" fill="#93B7FF">→</text>
